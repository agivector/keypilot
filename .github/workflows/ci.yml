name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify server and SDKs
        run: make docker-verify
      - name: Verify publishable SDK packages
        run: make release-package-check
      - name: Run Docker end-to-end verification
        run: make e2e
