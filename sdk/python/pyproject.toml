[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keypilot-sdk"
version = "0.1.0"
description = "KeyPilot issuer-scoped JWKS signature verification SDK"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "vectorshi" }]
dependencies = ["cryptography>=42,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["keypilot"]
