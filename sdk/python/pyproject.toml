[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keypilot-sdk"
version = "0.1.0"
description = "KeyPilot issuer-scoped JWKS signature verification SDK"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "vectorshi" }]
license = "MIT"
keywords = ["jwks", "rsa", "signature", "verification", "key-rotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42,<47"]

[project.urls]
Homepage = "https://github.com/agivector/keypilot"
Repository = "https://github.com/agivector/keypilot"
Issues = "https://github.com/agivector/keypilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["keypilot"]
